# ============================================================
# zy-common-web 配置片段（模板）
# 用法：复制需要的段落到业务服务的 application.yml，勿直接改本文件
# 所有开关均有默认值，零配置即可生效，这里只写需要覆盖的差异项
# ============================================================
zy:
  web:
    cors:
      enabled: true                # 关闭则置 false（如由网关统一处理跨域）
      allowed-origins:             # 用 originPatterns，支持 credentials + *
        - "*"
      allowed-headers:
        - "*"
      allowed-methods:
        - "*"
      exposed-headers:
        - X-Trace-Id
      # 默认 false；仅在 allowed-origins 收窄为可信域名时按需开启 Cookie 凭证。
      # Bearer Token 通过 Authorization 请求头发送，不依赖此开关。
      allow-credentials: false
      max-age: 3600
    trace:
      enabled: true
      header-name: X-Trace-Id
    log:
      enabled: true
      slow-threshold-ms: 3000      # 超过打 WARN
    validation:
      fail-fast: false             # true 只返回第一个校验错误

